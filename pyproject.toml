[project]
name = "ninna"
version = "0.1.0"
description = "Ninna Docker training workspace"
authors = [
    {name = "migo",email = "1695587905@qq.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "docker>=7.1,<8",
    "pydantic>=2.9,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "huggingface-hub (>=0.36,<1)",
    "aim (==3.29.1)",
    "numpy (>=1.26.4,<2)",
    "mcp (>=1.26,<2)",
    "httpx (>=0.28,<1)",
]

[project.scripts]
ninna = "ninna.commands.app:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.28"
ruff = "^0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real Docker and registered assets"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.poetry]
packages = [{include = "ninna", from = "src"}]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
